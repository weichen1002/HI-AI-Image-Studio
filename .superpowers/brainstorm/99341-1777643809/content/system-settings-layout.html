<h2>系统设置页：布局选哪个？</h2>
<p class="subtitle">用于配置「新用户注册赠送余额（可按来源分别配置）」等规则</p>

<div class="options">
  <div class="option" data-choice="single" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>单页分组</h3>
      <p>一个页面按“用户/积分/通知/安全”等分组；适合设置项不多的阶段</p>
    </div>
  </div>
  <div class="option" data-choice="tabs" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>顶部 Tab（类似你发的截图）</h3>
      <p>顶部分类切换；结构清晰，后续扩展更自然</p>
    </div>
  </div>
  <div class="option" data-choice="leftnav" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>左侧导航</h3>
      <p>更“后台”式；分类多时最稳，但视觉更重</p>
    </div>
  </div>
</div>

<div class="card" style="margin-top:16px">
  <div class="card-body">
    <h3 style="margin:0 0 6px 0">本次最小可交付</h3>
    <p style="margin:0" class="subtitle">
      先做「系统设置 / 积分规则」：注册赠送（按来源）+ 开关 + 立即生效 + 操作审计。
    </p>
  </div>
</div>
